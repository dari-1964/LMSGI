<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Tabla</title>
</head>
<body>

    <form>
        <table>
            <thead>
                <tr>
                    <td><label><b>sexo</b></label></td>
                    <td><label><b>profesion</b></label></td>
                    <td><label><b>aficiones</b></label></td>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <!-- Columna Sexo: todo baja con <br> -->
                    <td>
                        <input type="radio" name="sexo" value="hombre"/> <label>hombre</label><br>
                        <input type="radio" name="sexo" value="mujer"/> <label>mujer</label>
                    </td>
                    
                    <!-- Columna Profesión: todo baja con <br> -->
                    <td>
                        <input type="radio" name="profesion" value="profesor"/> <label>profesor</label><br>
                        <input type="radio" name="profesion" value="programador"/> <label>programador</label><br>
                        <input type="radio" name="profesion" value="Diseñador grafico"/> <label>Diseñador grafico</label>
                    </td>
                    
                    <!-- Columna Aficiones: todo baja con <br> -->
                    <td>
                        <input type="radio" name="aficiones" value="ciencia"/> <label>ciencia</label><br>
                        <input type="radio" name="aficiones" value="libros"/> <label>libros</label><br>
                        <input type="radio" name="aficiones" value="deporte"/> <label>deporte</label>
                    </td>
                </tr>
            </tbody>
        </table>

        <br>
        <label>Indique sus comentarios:</label><br>
        <textarea>comentario :</textarea><br>
        <br>
        
        <input type="submit" value="Enviar"/>
        <input type="reset" value="Limpiar todo"/>
    </form>

</body>
</html>
